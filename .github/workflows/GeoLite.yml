name: GeoLite.mmdb

on:
  repository_dispatch:
  workflow_dispatch:
  # schedule:
  #   - cron: 0 1 */3 * *

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: Asia/Tehran

    steps:
    - name: Checkout
      uses: actions/checkout@v2.3.4
      with:
        token: ${{ secrets.PAT }}

    - name: Set Variables
      run: |
        echo "TAG_NAME=$(date +"%Y.%m.%d")" >> $GITHUB_ENV

    - name: Sync GeoLite.mmdb
      run: |
        # Clean Repository
        mkdir -p storage/GeoLite2-ASN
        mkdir -p storage/GeoLite2-City
        mkdir -p storage/GeoLite2-Country
        mkdir -p storage/GeoLite-temp

        wget -nv -O "storage/GeoLite-temp/GeoLite2-ASN.mmdb" "https://github.com/P3TERX/GeoLite.mmdb/raw/download/GeoLite2-ASN.mmdb"
        wget -nv -O "storage/GeoLite-temp/GeoLite2-Country.mmdb" "https://github.com/P3TERX/GeoLite.mmdb/raw/download/GeoLite2-Country.mmdb"
        wget -nv -O "storage/GeoLite-temp/GeoLite2-City.mmdb" "https://github.com/P3TERX/GeoLite.mmdb/raw/download/GeoLite2-City.mmdb"

        if [ -f storage/GeoLite-temp/GeoLite2-ASN.mmdb ]; then
          mv storage/GeoLite-temp/GeoLite2-ASN.mmdb storage/GeoLite2-ASN/GeoLite2-ASN.mmdb
        fi

        if [ -f storage/GeoLite-temp/GeoLite2-City.mmdb ]; then
          mv storage/GeoLite-temp/GeoLite2-City.mmdb storage/GeoLite2-City/GeoLite2-City.mmdb
        fi

        if [ -f storage/GeoLite-temp/GeoLite2-Country.mmdb ]; then
          mv storage/GeoLite-temp/GeoLite2-Country.mmdb storage/GeoLite2-Country/GeoLite2-Country.mmdb
        fi

        rm -rf storage/GeoLite-temp

    - name: Auto Update GeoLite mmdb
      uses: stefanzweifel/git-auto-commit-action@v4
      with:
        commit_message: "Github Action: Auto Update GeoLite mmdb - ${{ env.TAG_NAME }}"
