version: '2.1'

services:
  redis:
    image: redis:7.2-alpine
    restart: always
    container_name: redis
    networks:
      - backend
    ports:
      - '6379:6379'
    command: redis-server --save 20 1 --loglevel warning
    volumes:
      - ./cache:/data

  sspanel:
    image: ttracy/panel:latest
    container_name: sspanel
    restart: always
    networks:
      - backend
      - frontend
    links:
      - "${db_host}"
      - redis
    ports:
      - 80:80
      - 443:443
    env_file:
      - .env
    depends_on:
      ss_db:
        condition: service_healthy

  ss_db:
    image: mariadb:11.1
    container_name: ss_db
    restart: always
    networks:
      - backend
    ports:
      - 3306:3306
    environment:
      - MARIADB_MYSQL_LOCALHOST_USER=1
    env_file:
      - .env
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--su=mysql", "--connect", "--innodb_initialized" ]
      timeout: 20s
      retries: 10

networks:
  backend:
    internal: true
  frontend: