version: '2.1'

services:
  redis:
    image: redis:7.2-alpine
    restart: always
    container_name: redis
    ports:
      - '6379:6379'
    command: redis-server --save 20 1 --loglevel warning
    volumes:
      - ./cache:/data

  sspanel:
    image: ttracy/panel:latest
    container_name: sspanel
    restart: always
    volumes:
      - ./:/var/www/html
    links:
      - "${db_host}"
      - redis
    ports:
      - 80:80
      - 9003:9003
    env_file:
      - .env
    depends_on:
      ss_db:
        condition: service_healthy

  ss_db:
    image: mariadb:11.1
    container_name: ss_db
    restart: always
    ports:
      - 3306:3306
    environment:
      - MARIADB_MYSQL_LOCALHOST_USER=1
    env_file:
      - .env
    healthcheck:
      test:
        [
          "CMD",
          "healthcheck.sh",
          "--su=mysql",
          "--connect",
          "--innodb_initialized"
        ]
      timeout: 20s
      retries: 10

  myadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: myadmin
    restart: always
    environment:
      - PMA_ARBITRARY=1
      - PMA_HOST=ss_db
    ports:
      - "8090:80"
    links:
      - ss_db:db

  snidust:
    container_name: snidust
    environment:
      - 'ALLOWED_CLIENTS=127.0.0.1'
      - EXTERNAL_IP=10.111.123.8
      - SPOOF_ALL_DOMAINS=false # Set to true (case sensetive!) if you want spoof ALL domains.
    ports:
      - '443:443'
      - '80:80'
      - '53:5300/udp'
    image: 'ghcr.io/seji64/snidust:main'

