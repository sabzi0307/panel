name: GeoLite.mmdb

on:
  repository_dispatch:
  workflow_dispatch:
  schedule:
    - cron: 0 1 */3 * *

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: Asia/Tehran

    steps:
    - name: Checkout
      uses: actions/checkout@v2.3.4

    - name: Set Variables
      run: |
        echo "TAG_NAME=$(date +"%Y.%m.%d")" >> $GITHUB_ENV

    - name: Sync GeoLite.mmdb
      run: |
        # Clean Repository
        mkdir -p storage/GeoLite2-ASN
        mkdir -p storage/GeoLite2-City
        mkdir -p storage/GeoLite2-Country
        rm -rf storage/GeoLite2-*/*
        wget -nv -O "storage/GeoLite2-ASN/GeoLite2-ASN.mmdb" "https://github.com/P3TERX/GeoLite.mmdb/raw/download/GeoLite2-ASN.mmdb"
        wget -nv -O "storage/GeoLite2-ASN/GeoLite2-Country.mmdb" "https://github.com/P3TERX/GeoLite.mmdb/raw/download/GeoLite2-Country.mmdb"
        wget -nv -O "storage/GeoLite2-ASN/GeoLite2-City.mmdb" "https://github.com/P3TERX/GeoLite.mmdb/raw/download/GeoLite2-City.mmdb"

    # - name: Push to "dev" branch
    #   run: |
    #     git config user.name "${{ github.actor }}"
    #     git config user.email "${{ github.actor }}@users.noreply.github.com"
    #     git add .
    #     git commit -m "${{ env.TAG_NAME }}"
    #     git remote set-url origin "https://${{ github.actor }}:${{ secrets.PAT }}@github.com/${{ github.repository }}"
    #     git push origin dev

    - name: Commit files
      run: |
        git config user.name "${{ github.actor }}"
        git config user.email "${{ github.actor }}@users.noreply.github.com"
        git commit -a -m "Update GeoLite mmdb - ${{ env.TAG_NAME }}"

    - name: Push changes
      uses: ad-m/github-push-action@master
      with:
        github_token: ${{ secrets.PAT }}
        branch: ${{ github.ref }}

