<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iframe Example</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        .iframe-container {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        iframe {
            width: 80%;
            height: 80vh;
            border: none;
        }
    </style>
     <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="iframe-container">
        <iframe src="https://tunnelazadi.top/auth/register"></iframe>
    </div>
</body>
</html>
