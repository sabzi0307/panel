version: '2.1'

services:
  redis:
    image: redis:latest
    restart: always
    container_name: redis
    ports:
      - '6379:6379'
    command: redis-server --save 20 1 --loglevel warning --requirepass ${redis_password}
    volumes:
      - ./cache:/data
  sspanel:
    image: ttracy/panel:latest
    container_name: sspanel
    restart: always
    volumes:
      - ./:/var/www/html
    links:
      - "${db_host}"
      - redis
    ports:
      - 80:80
      - 443:443
      - 9003:9003
    env_file:
      - .env
    depends_on:
      ss_db:
        condition: service_healthy

  ss_db:
    image: mariadb:10.6.14
    container_name: ss_db
    restart: always
    ports:
      - 3306:3306
    env_file:
      - .env
    command:
      [
        'mysqld',
        '--character-set-server=utf8mb4',
        '--collation-server=utf8mb4_unicode_ci'
      ]
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      timeout: 20s
      retries: 10

  myadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: myadmin
    restart: always
    environment:
      - PMA_ARBITRARY=1
      - PMA_HOST=ss_db
    ports:
      - "8090:80"
    links:
      - ss_db:db

