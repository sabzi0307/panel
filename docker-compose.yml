version: '3'

services:
    sspanel:
        image: sspaneluim/panel
        env_file: .env
        container_name: sspanel
        depend_on: sspaneldb
        restart: always
        ports:
            - 80:80
        volumes:
            - ./config/.config.php:/var/www/config/.config.php
    mariadb:
        image: mariadb:10.9
        container_name: sspaneldb
        restart: always
        volumes:
          - "/Users/yetongxue/docker_v/docker_test/db:/var/lib/mysql"
        command: ['mysqld', '--character-set-server=utf8mb4', '--collation-server=utf8mb4_unicode_ci']
        environment:
          MYSQL_ROOT_PASSWORD: sspanel
          MYSQL_DATABASE: sspanel

    phpmyadmin:
        image: phpmyadmin
        container_name: phpmyadmin
        restart: always
        ports:
          - 8080:80
        environment:
          - PMA_ARBITRARY=1
